<!-- ═══════════ Browse modal ═══════════ -->
<div class="modal-backdrop" id="browseModal" role="dialog" aria-modal="true" aria-labelledby="browseTitle">
  <div class="modal" style="width:560px;">
    <div class="modal-head">
      <h3 id="browseTitle"><span data-icon="folder"></span>Choose a folder</h3>
      <button class="close-x" data-close="browseModal" aria-label="Close"><span data-icon="x"></span></button>
    </div>
    <div class="modal-body">
      <!-- G26: the whole drive, where the picker scans (browseOfferDrives) —
           named as the disk layout names it, never guessed. -->
      <div class="chips browse-drives" id="browseDrives" role="group" aria-label="Whole drive" hidden></div>
      <!-- QA D05: the path line is a field — the typing route, in every
           context the picker opens from (before the first scan the Scan
           card's path box is not on screen). -->
      <input type="text" id="browseCurrent" style="width:100%;" aria-label="Folder shown — type a path and press Enter to open it" autocomplete="off" spellcheck="false">
      <div class="muted" id="browseHint" style="font-size:12px;margin-top:6px;">Type a path and press Enter, or open a folder below.</div>
      <div class="chips" id="browseChips"></div>
      <div class="browse-list" id="browseList"></div>
    </div>
    <div class="modal-foot">
      <!-- G26: dot-folders wait to be asked for; this browser remembers. -->
      <label class="browse-hidden-toggle"><input type="checkbox" id="browseShowHidden"> Show hidden folders<span id="browseHiddenCount"></span></label>
      <div style="flex:1"></div>
      <button class="btn btn-primary" id="browseUseBtn"><span data-icon="check"></span>Scan this folder</button>
    </div>
  </div>
</div>

<!-- ═══════════ Confirm modal ═══════════ -->
<div class="modal-backdrop" id="confirmModal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="modal" style="width:430px;">
    <div class="modal-head">
      <h3 id="confirmTitle"><span data-icon="trash"></span>Move to Trash?</h3>
      <button class="close-x" data-close="confirmModal" aria-label="Close"><span data-icon="x"></span></button>
    </div>
    <div class="modal-body">
      <div class="muted" id="confirmText" style="font-size:13.5px;line-height:1.55;"></div>
      <!-- B2: filled in when a program holds one of these files open. Lives
           inside the one confirmation dialog every view shares, so no view can
           delete without it. -->
      <div id="confirmOpenHandles" hidden role="status"></div>
    </div>
    <div class="modal-foot">
      <div style="flex:1"></div>
      <button class="btn" id="confirmCancel" data-close="confirmModal">Cancel</button>
      <button class="btn btn-danger" id="confirmOk"><span data-icon="trash"></span>Move to Trash</button>
    </div>
  </div>
</div>

<!-- ═══════════ Ask modal (D65) ═══════════
     One question with a typed one-line answer: a saved view's name, a fleet
     pairing code, a folder for a paired machine to scan. window.prompt() is
     not implemented in Electron — it returns nothing there — so every such
     question asks through this sheet (askText). -->
<div class="modal-backdrop" id="askModal" role="dialog" aria-modal="true" aria-labelledby="askTitle">
  <div class="modal" style="width:430px;">
    <div class="modal-head">
      <h3 id="askTitle">Name this</h3>
      <button class="close-x" data-close="askModal" aria-label="Close"><span data-icon="x"></span></button>
    </div>
    <div class="modal-body">
      <label for="askInput" id="askLabel" class="muted" style="display:block;margin-bottom:7px;font-size:12.5px;"></label>
      <input type="text" id="askInput" autofocus autocomplete="off" spellcheck="false" style="width:100%;">
    </div>
    <div class="modal-foot">
      <div style="flex:1"></div>
      <button class="btn" data-close="askModal">Cancel</button>
      <button class="btn btn-primary" id="askOk">OK</button>
    </div>
  </div>
</div>
