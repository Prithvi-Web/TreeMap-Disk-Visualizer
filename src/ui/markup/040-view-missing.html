  <!-- ═══════════ The Missing Gigabytes (v4 §5) ═══════════
       One accounting statement for the volume the scan lives on. The receipt
       either balances or names the gap; it never quietly folds the residual
       into another line to look tidy. -->
  <section class="view" id="view-missing" role="tabpanel" aria-label="Missing Gigabytes" hidden>
    <div class="card glass">
      <h2><span data-icon="pie"></span>Where the space actually went</h2>
      <div class="apps-info muted" id="missingInfo"></div>
      <div id="missingBody" aria-live="polite"><div class="muted">Run a scan to reconcile this disk.</div></div>
      <!-- What this part is working on, said aloud: its loader puts the sentence of the working rows it writes here (sayWorking), beside the card's body, whose every write would take it away. -->
      <div id="missingWorking" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
    </div>
  </section>
