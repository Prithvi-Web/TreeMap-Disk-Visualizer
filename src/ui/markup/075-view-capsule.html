  <!-- ═══════════ Undo Vault (B3) ═══════════ -->
  <section class="view" id="view-capsule" role="tabpanel" aria-label="Undo Vault" hidden>
    <div class="card glass">
      <h2><span data-icon="clock"></span>Undo Vault</h2>
      <div class="apps-info muted" id="capsuleInfo"></div>
      <div class="capsule-gauge" id="capsuleGauge" hidden>
        <div class="cap-gauge-wrap"><canvas id="capsuleGaugeCanvas" aria-label="Undo Vault space used against its cap" role="img"></canvas></div>
        <div class="muted num" id="capsuleGaugeText"></div>
      </div>
      <!-- Hidden while the summary line above is empty, i.e. while there is
           nothing to search (design pass G02, the rule in 080). -->
      <div class="rule-row" id="capsuleSearchRow" style="margin-bottom:10px;">
        <div class="field" style="flex:1;max-width:420px;">
          <span data-icon="search"></span>
          <input type="text" id="capsuleSearch" placeholder="Search by name or original path…" aria-label="Search protected items" autocomplete="off">
        </div>
      </div>
      <div id="capsuleBody"></div>
      <!-- What this part is working on, said aloud: its loader puts the sentence of the working rows it writes here (sayWorking), beside the card's body, whose every write would take it away. -->
      <div id="capsuleWorking" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
      <div id="capsuleEvents"></div>
    </div>
  </section>
