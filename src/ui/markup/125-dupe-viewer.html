<!-- ═══════════ Duplicate viewer (v4 §8.2) ═══════════ -->
<div class="modal-backdrop" id="dupeViewerModal" role="dialog" aria-modal="true" aria-labelledby="dupeViewerTitle">
  <div class="modal" style="width:min(94vw,960px);">
    <div class="modal-head">
      <h3 id="dupeViewerTitle"><span data-icon="copy"></span>Compare copies</h3>
      <button class="close-x" id="dupeViewerClose" aria-label="Close"><span data-icon="x"></span></button>
    </div>
    <div class="modal-body">
      <div class="muted" id="dupeViewerSummary" role="status" style="margin-bottom:10px;"></div>
      <div class="dv-panes" id="dupeViewerPanes"></div>
      <div class="muted num" id="dupeViewerHint" style="margin-top:10px;">← → between groups · 1–9 choose the keeper · Space stages the others · Esc closes</div>
    </div>
  </div>
</div>
