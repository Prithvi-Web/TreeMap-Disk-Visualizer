name: Tests

# Runs the suite on all three supported operating systems.
#
# This exists because of a stated constraint: much of src/platform/ was written
# on macOS against documented Windows and Linux APIs and has never been executed
# on those systems. The pure parts (parsers, bit arithmetic, argv construction)
# are unit-tested everywhere and run in every job below; the parts that can only
# be proven by actually calling the OS — does RmGetList return a process name,
# does lsblk accept -O, does /proc report what the code expects — are proven
# here and nowhere else.
#
# A job failing on one OS therefore carries real information: it means a
# mechanism does not behave as documented, which is exactly what needs to
# surface in CI rather than on a user's machine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      # Never cancel the other OSes when one fails — a Windows-only failure is
      # information about Windows, not a reason to lose the Linux result.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Run the test suite
        # bash on every OS so the tee + pipefail combination means one thing.
        shell: bash
        run: |
          set -o pipefail
          # `--test-reporter=tap` is PINNED rather than inherited. Node's
          # default reporter depends on the version and on whether stdout is a
          # TTY — this repo has already recorded that `npm test` uses the SPEC
          # reporter locally even when piped. The annotator below reads TAP, so
          # leaving the format to a default makes the diagnostic step silently
          # useless the day Node is bumped.
          npm test -- --test-reporter=tap 2>&1 | tee test-output.tap
        env:
          # Tests must never touch the real app-data directory: scan tests
          # write snapshots, and a shared directory is how junk roots ended up
          # in a real user's snapshots.json before.
          TREEMAP_DATA_DIR: ${{ runner.temp }}/treemap-test-data

      - name: Surface each failing test as an annotation
        # Job logs require admin rights to read through the REST API, and step
        # summaries are not exposed there at all — so annotations are the only
        # way a failure reaches anyone who was not watching the run. The
        # annotator therefore puts the ASSERTION in the annotation, not just
        # the test name: a name on its own has now cost this project three
        # sessions, most recently three red runs in a row whose only public
        # record was `not ok 4 - agent summary: ...`.
        #
        # It replaces inline bash that could not finish. GitHub runs
        # `shell: bash` as `bash -e -o pipefail`, and the old step's second
        # pipeline was `grep '^# Error' … | head -5 | while …`. An ordinary
        # failure has no `# Error` lines, so that grep exited 1, pipefail
        # promoted it, and `-e` killed the step before it ever wrote the step
        # summary — the very place the assertions were supposed to go.
        if: failure()
        shell: bash
        # Plain `node`, not `npx tsx`: this is the last-resort diagnostic step
        # and it must not need a transpiler, a registry fetch, or the Windows
        # `.cmd` shim that `scripts/run-tests.js` exists to avoid. `failure()`
        # also fires when the job died in `npm ci`, and `tsx` would not be
        # installed to explain that.
        run: node scripts/tap-annotate.js test-output.tap

      - name: Report this machine's detected capabilities
        # Not an assertion — a record. Reading what each OS actually detected is
        # how a capability that quietly regresses to "unavailable" gets noticed,
        # since an honest unavailable state passes every test by design.
        run: npm run capabilities:report
        env:
          TREEMAP_DATA_DIR: ${{ runner.temp }}/treemap-test-data
