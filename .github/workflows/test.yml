name: Tests

# Runs the suite on all three supported operating systems.
#
# This exists because of a stated constraint: much of src/platform/ was written
# on macOS against documented Windows and Linux APIs and has never been executed
# on those systems. The pure parts (parsers, bit arithmetic, argv construction)
# are unit-tested everywhere and run in every job below; the parts that can only
# be proven by actually calling the OS — does RmGetList return a process name,
# does lsblk accept -O, does /proc report what the code expects — are proven
# here and nowhere else.
#
# A job failing on one OS therefore carries real information: it means a
# mechanism does not behave as documented, which is exactly what needs to
# surface in CI rather than on a user's machine.
#
# One Linux leg runs the whole suite under a Portuguese locale. Node takes its
# default locale from the environment, and a Portuguese Windows once failed a
# test that hard-coded "1,234" where the machine printed "1.234" (issue #34).
# Numbers and dates a person reads are now written the English way everywhere
# (the machine keeps its clock and time zone), and this leg is the proof that
# neither the app nor a test follows the machine again.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    strategy:
      # Never cancel the other OSes when one fails — a Windows-only failure is
      # information about Windows, not a reason to lose the Linux result.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux
          - os: ubuntu-latest
            name: Linux (pt-BR locale)
            locale: pt_BR.UTF-8
            expect: pt-BR
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        id: install
        run: npm ci

      # The native core (native/treemap-core, Rust) is built on every leg so a
      # platform whose module does not compile fails here, never on a user's
      # machine. Users never need Rust: npm ci does not touch the crate, and the
      # app falls back to the legacy engines with a stated reason when the
      # module is absent.
      - name: Set up Rust
        # rustup comes from here; the VERSION does not. rustup reads
        # native/treemap-core/rust-toolchain.toml for every cargo command run
        # in that folder and installs that version on first use, so this job,
        # the release job and a developer's machine all build with one Rust.
        # Before the pin, `stable` here was 1.98.1 while the developer's machine
        # had 1.97.0 — "passes locally" had never simulated CI.
        if: ${{ !cancelled() }}
        uses: dtolnay/rust-toolchain@stable

      - name: Cache the Rust build
        if: ${{ !cancelled() }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/treemap-core

      # Three steps, not one, each appending to cargo-output.log for the
      # annotator below. As one step, the first failure hid the rest: CI's Rust
      # check had never once passed, and each red run showed only the first
      # thing wrong — fmt, then a Linux-only lint, then "exit code 101" with no
      # way to read further, because job logs need admin rights. Each step runs
      # whatever happened before it (`!cancelled()`), and the tests run with
      # --no-fail-fast, so one run reports every failure there is.
      - name: Check the native core's format
        id: fmt
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: native/treemap-core
        run: |
          set -o pipefail
          rustc --version 2>&1 | tee -a ../../cargo-output.log
          cargo fmt --all -- --check 2>&1 | tee -a ../../cargo-output.log

      - name: Lint the native core
        id: clippy
        if: ${{ !cancelled() }}
        shell: bash
        working-directory: native/treemap-core
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee -a ../../cargo-output.log

      - name: Test the native core
        id: cargotest
        if: ${{ !cancelled() }}
        # A test that hangs is a failure with a name, not a six-hour job: libtest
        # prints "has been running for over 60 seconds" for it, and the
        # annotator turns that line into a warning.
        timeout-minutes: 20
        shell: bash
        working-directory: native/treemap-core
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee -a ../../cargo-output.log

      - name: Surface each failing Rust check as an annotation
        # The only channel a Rust failure reaches anyone through (see
        # scripts/cargo-annotate.js): the assertion, the signal a test binary
        # died of, the lint and its line, the file rustfmt would change.
        if: ${{ !cancelled() && (steps.fmt.outcome == 'failure' || steps.clippy.outcome == 'failure' || steps.cargotest.outcome == 'failure' || steps.cargotest.outcome == 'cancelled') }}
        shell: bash
        run: node scripts/cargo-annotate.js cargo-output.log native/treemap-core

      # Everything below runs even when a Rust step failed: the Node suite is
      # where the equivalence gate proves the Windows and Linux listings, and a
      # lint failure is no reason to lose that. The job still fails.
      - name: Build the native module for this platform
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build:native

      - name: Run this leg as a Brazilian PC would
        # LC_ALL is where Node (ICU) reads its default locale from. It is set
        # here, through GITHUB_ENV, and not as `env:` on the test step: an
        # `env:` entry that resolves to '' is not "unset" to ICU — Node reads
        # LC_ALL="" as the root locale `und` — so the three ordinary legs would
        # have stopped testing what a real machine does. locale-gen makes the
        # locale exist on the runner: without it every child bash and perl the
        # suite spawns warns "setlocale: LC_ALL: cannot change locale", and
        # those lines would land in the TAP the annotator reads.
        if: ${{ !cancelled() && matrix.locale }}
        run: |
          sudo locale-gen ${{ matrix.locale }}
          echo "LC_ALL=${{ matrix.locale }}" >> "$GITHUB_ENV"
          echo "LANG=${{ matrix.locale }}" >> "$GITHUB_ENV"
          # The suite compares this with the locale Intl actually resolved, so
          # a leg that quietly ran in English fails instead of passing twice.
          echo "TREEMAP_EXPECT_LOCALE=${{ matrix.expect }}" >> "$GITHUB_ENV"

      - name: Type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

      - name: Run the test suite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        # bash on every OS so the tee + pipefail combination means one thing.
        shell: bash
        run: |
          set -o pipefail
          # `--test-reporter=tap` is PINNED rather than inherited. Node's
          # default reporter depends on the version and on whether stdout is a
          # TTY — this repo has already recorded that `npm test` uses the SPEC
          # reporter locally even when piped. The annotator below reads TAP, so
          # leaving the format to a default makes the diagnostic step silently
          # useless the day Node is bumped.
          npm test -- --test-reporter=tap 2>&1 | tee test-output.tap
        env:
          # Tests must never touch the real app-data directory: scan tests
          # write snapshots, and a shared directory is how junk roots ended up
          # in a real user's snapshots.json before.
          TREEMAP_DATA_DIR: ${{ runner.temp }}/treemap-test-data

      - name: Surface each failing test as an annotation
        # Job logs require admin rights to read through the REST API, and step
        # summaries are not exposed there at all — so annotations are the only
        # way a failure reaches anyone who was not watching the run. The
        # annotator therefore puts the ASSERTION in the annotation, not just
        # the test name: a name on its own has now cost this project three
        # sessions, most recently three red runs in a row whose only public
        # record was `not ok 4 - agent summary: ...`.
        #
        # It replaces inline bash that could not finish. GitHub runs
        # `shell: bash` as `bash -e -o pipefail`, and the old step's second
        # pipeline was `grep '^# Error' … | head -5 | while …`. An ordinary
        # failure has no `# Error` lines, so that grep exited 1, pipefail
        # promoted it, and `-e` killed the step before it ever wrote the step
        # summary — the very place the assertions were supposed to go.
        if: failure()
        shell: bash
        # Plain `node`, not `npx tsx`: this is the last-resort diagnostic step
        # and it must not need a transpiler, a registry fetch, or the Windows
        # `.cmd` shim that `scripts/run-tests.js` exists to avoid. `failure()`
        # also fires when the job died in `npm ci`, and `tsx` would not be
        # installed to explain that.
        run: node scripts/tap-annotate.js test-output.tap

      - name: Report this machine's detected capabilities
        # Not an assertion — a record. Reading what each OS actually detected is
        # how a capability that quietly regresses to "unavailable" gets noticed,
        # since an honest unavailable state passes every test by design.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run capabilities:report
        env:
          TREEMAP_DATA_DIR: ${{ runner.temp }}/treemap-test-data
