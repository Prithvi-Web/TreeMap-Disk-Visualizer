[package]
name = "tm-node"
description = "napi-rs bindings: the only crate Node touches."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
tm-governor = { path = "../tm-governor" }
tm-mft = { path = "../tm-mft" }
tm-store = { path = "../tm-store" }
tm-walk = { path = "../tm-walk" }
napi = { workspace = true }
napi-derive = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The loader call that pins the addon so Node never unmaps it (src/pin.rs; RISKS R96).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[build-dependencies]
napi-build = { workspace = true }
