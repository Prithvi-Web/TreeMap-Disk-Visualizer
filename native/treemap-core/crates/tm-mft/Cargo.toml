[package]
name = "tm-mft"
description = "The NTFS master file table, read as records: the FILE-record parser, the run-list decoder, the tree builder and the read-only volume reader; everything but the Windows calls portable and tested on synthetic records and volumes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tm-walk = { path = "../tm-walk" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming"] }

[target.'cfg(windows)'.dev-dependencies]
tm-governor = { path = "../tm-governor" }
