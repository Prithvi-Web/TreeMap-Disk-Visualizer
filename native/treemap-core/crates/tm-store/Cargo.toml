[package]
name = "tm-store"
description = "The finalized scan store, built in Rust from the walk's columns in PackedScanStore's own layout."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
tm-walk = { path = "../tm-walk" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# Spill files (T13a): the constants `CreateFileW` takes. Win32_Storage_FileSystem is
# already enabled by tm-walk and tm-mft, so nothing more of windows-sys is compiled.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
